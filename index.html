<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 11 Quesitos de la Ficción</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#1c1917;--muted:#6b645c;--accent:#d97706;--accent2:#be123c;--line:rgba(0,0,0,.08);--shadow:0 6px 24px rgba(0,0,0,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#161d33;--text:#f8fafc;--muted:#9aa6bf;--accent:#fbbf24;--accent2:#fb7185;--line:rgba(255,255,255,.08);--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#161d33;--text:#f8fafc;--muted:#9aa6bf;--accent:#fbbf24;--accent2:#fb7185;--line:rgba(255,255,255,.08);--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;padding:0 1rem 4rem;background-image:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 40%),radial-gradient(circle at 90% 10%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 35%)}
.wrap{max-width:960px;margin:0 auto}
.theme{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));right:.8rem;z-index:20;border:1px solid var(--line);background:var(--card);color:var(--text);width:42px;height:42px;border-radius:50%;font-size:1.1rem;cursor:pointer;box-shadow:var(--shadow)}
header{text-align:center;padding:3.5rem 0 2rem}
.eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:.8rem}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--muted);margin:1rem auto 0;max-width:560px;font-size:1.05rem}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:1rem;align-items:end;margin:2rem 0 2.5rem}
.pod{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.4rem 1rem;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s}
.pod:hover{transform:translateY(-6px)}
.pod.p1{padding-top:2rem;padding-bottom:2rem;border-color:var(--accent)}
.pod .medal{font-size:1.8rem}
.pod .av{width:84px;height:84px;margin:.6rem auto;font-size:1.8rem}
.p1 .av{width:104px;height:104px;font-size:2.2rem}
.pod h3{font-size:1.05rem}.pod small{color:var(--muted);display:block;margin-top:.2rem;font-size:.8rem}
.tools{position:sticky;top:0;z-index:10;padding:.8rem 0;margin-bottom:1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.search{flex:1 1 200px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:.7rem 1rem;border-radius:999px;font-size:.95rem;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:.5rem .9rem;border-radius:999px;font-size:.85rem;cursor:pointer;font-weight:600}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.list{display:flex;flex-direction:column;gap:1rem}
.card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s,box-shadow .2s}
.card.in{opacity:1;transform:none}
.card:hover{box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 30%,transparent)}
.rank{min-width:64px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;letter-spacing:.03em;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.25);flex-shrink:0}
.side{padding:1.2rem;display:flex;align-items:center}
.side .av{width:88px;height:88px;font-size:1.9rem}
.info{padding:1.2rem 1.2rem 1.2rem 0;flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.info h2{font-size:1.4rem}
.origin{color:var(--accent2);font-weight:700;font-size:.92rem;margin:.15rem 0 .6rem}
.tag{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .6rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700;margin-bottom:.5rem}
.desc{color:var(--muted);line-height:1.5;font-size:.95rem}
.heart{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:.35rem .7rem;cursor:pointer;font-size:.9rem;white-space:nowrap}
.heart.on{color:var(--accent2);border-color:var(--accent2)}
.empty{text-align:center;color:var(--muted);padding:2rem}
footer{text-align:center;color:var(--muted);margin-top:3rem;font-size:.85rem}
@media (max-width:640px){
 .podium{grid-template-columns:1fr;}
 .card{flex-wrap:wrap}
 .rank{width:100%;min-height:44px;font-size:1.3rem}
 .side{padding:1rem 0 0 1rem}.side .av{width:72px;height:72px}
 .info{padding:1rem}
}
@media (prefers-reduced-motion:reduce){.card{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Cambiar tema">🌓</button>
<div class="wrap">
<header>
 <span class="eyebrow">Ranking personal · 2026</span>
 <h1>Top 11 Quesitos de la Ficción</h1>
 <p>Mi selección definitiva de los mejores quesitos del anime, los videojuegos y las novelas visuales.</p>
</header>
<section class="podium" id="podium" aria-label="Podio"></section>
<div class="tools">
 <input class="search" id="q" type="search" placeholder="Buscar personaje u obra…" aria-label="Buscar">
 <div class="chips" id="chips"></div>
</div>
<main class="list" id="list"></main>
<footer>Hecho con cariño · ¿Algún quesito que falte? Siempre se puede ampliar el top.</footer>
</div>
<script>
const D=[
{n:"Beatrice",o:"Umineko When They Cry",t:"Novela visual",d:"La Bruja Dorada. Un quesito inolvidable por su carisma, su risa icónica y la enorme complejidad de su trasfondo en el juego del ingenio.",c:["#f59e0b","#b45309"]},
{n:"Mythra",o:"Xenoblade Chronicles 2",t:"Videojuego",d:"La Aegis de luz. Un quesito con un diseño espectacular, un poder abrumador y un desarrollo emocional clave a lo largo de la saga.",c:["#fde047","#f97316"]},
{n:"Maya Fey",o:"Ace Attorney",t:"Videojuego",d:"La mentora legendaria. Excelente abogada defensora, un quesito elegante, inteligente y la guía fundamental en los momentos más difíciles.",c:["#8b5cf6","#4c1d95"]},
{n:"Primrose Azelhart",o:"Octopath Traveler",t:"Videojuego",d:"Un quesito bailarina con una de las historias de venganza y determinación más oscuras y cautivadoras en los JRPG modernos.",c:["#e11d48","#7f1d1d"]},
{n:"2B",o:"NieR: Automata",t:"Videojuego",d:"Un quesito androide con un diseño estético impecable, combates magistrales y una carga existencial que define su narrativa.",c:["#64748b","#0f172a"]},
{n:"Makise Kurisu",o:"Steins;Gate",t:"Anime",d:"La brillante investigadora apodada “Christina”. Un quesito tsundere sumamente inteligente que se gana el corazón de todos con su lealtad.",c:["#ef4444","#9f1239"]},
{n:"Yor Forger",o:"Spy x Family",t:"Anime",d:"La Princesa de las Espinas. Un quesito adorable e ingenuo en su vida cotidiana, pero una asesina letal e imponente cuando entra en acción.",c:["#be123c","#1f2937"]},
{n:"Ryuko Matoi",o:"Kill la Kill",t:"Anime",d:"Un quesito rebelde y temperamental que destaca por su diseño audaz, su actitud combativa y su tijera gigante.",c:["#dc2626","#111827"]},
{n:"Tifa Lockhart",o:"Final Fantasy VII",t:"Videojuego",d:"Un quesito clásico e icónico del mundo del videojuego, caracterizada por su fuerza en combate cuerpo a cuerpo y su personalidad empática.",c:["#92400e","#451a03"]},
{n:"Miku Nakano",o:"The Quintessential Quintuplets",t:"Anime",d:"Un quesito reservado, fanática de la historia japonesa, cuyo crecimiento personal y ternura la volvieron una de las favoritas de la serie.",c:["#06b6d4","#1e3a8a"]},
{n:"Rosalia",o:"Bloons TD 6",t:"Videojuego",d:"Un quesito brillante y lleno de energía, apasionado de la tecnología y los inventos, cuyo ingenio mecánico y espíritu vibrante lo convirtieron rápidamente en favorito de la comunidad.",c:["#22c55e","#065f46"]}
];
const ini=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
const av=(x,cls="")=>`<div class="av ${cls}" style="background:linear-gradient(135deg,${x.c[0]},${x.c[1]})">${ini(x.n)}</div>`;
let likes={},filter="Todos",term="";
try{likes=JSON.parse(localStorage.getItem("quesito-likes")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("quesito-likes",JSON.stringify(likes))}catch(e){}};
const medals=["🥇","🥈","🥉"];
document.getElementById("podium").innerHTML=[1,0,2].map(i=>{const x=D[i];return `<div class="pod p${i+1}" data-go="${i}"><div class="medal">${medals[i]}</div>${av(x)}<h3>${x.n}</h3><small>${x.o}</small></div>`}).join("");
const types=["Todos",...new Set(D.map(x=>x.t))];
const chips=document.getElementById("chips");
chips.innerHTML=types.map(t=>`<button class="chip${t==="Todos"?" on":""}" data-t="${t}">${t}</button>`).join("");
const list=document.getElementById("list");
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
function render(){
 const rows=D.map((x,i)=>({x,i})).filter(({x})=>(filter==="Todos"||x.t===filter)&&(x.n+" "+x.o).toLowerCase().includes(term));
 list.innerHTML=rows.length?rows.map(({x,i})=>`<article class="card" id="c${i}"><div class="rank">#${i+1}</div><div class="side">${av(x)}</div><div class="info"><div class="top"><div><span class="tag">${x.t}</span><h2>${x.n}</h2></div><button class="heart${likes[i]?" on":""}" data-h="${i}" aria-pressed="${!!likes[i]}">${likes[i]?"♥ Favorito":"♡ Favorito"}</button></div><div class="origin">${x.o}</div><p class="desc">${x.d}</p></div></article>`).join(""):'<p class="empty">No se encontró ningún quesito con ese filtro 🧀</p>';
 list.querySelectorAll(".card").forEach(c=>io.observe(c));
}
chips.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.t;chips.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));render()};
document.getElementById("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
list.onclick=e=>{const h=e.target.closest(".heart");if(!h)return;const i=h.dataset.h;likes[i]=!likes[i];save();h.classList.toggle("on",likes[i]);h.textContent=likes[i]?"♥ Favorito":"♡ Favorito";h.setAttribute("aria-pressed",!!likes[i])};
document.getElementById("podium").onclick=e=>{const p=e.target.closest(".pod");if(!p)return;filter="Todos";term="";document.getElementById("q").value="";chips.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.t==="Todos"));render();const t=document.getElementById("c"+p.dataset.go);t.classList.add("in");t.scrollIntoView({behavior:"smooth",block:"center"})};
document.getElementById("theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
